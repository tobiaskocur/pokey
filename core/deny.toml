# cargo-deny policy, run in CI by the `deps` job of .github/workflows/core-ci.yml.
# Pokey is Apache-2.0: only licenses that can be combined with it are allowed.
[graph]
all-features = true

[advisories]
# Every RustSec advisory (vulnerability, unmaintained, unsound, yanked) fails
# the build. Add an `ignore` entry with a reason only after reading it.
ignore = []

[licenses]
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CC0-1.0",
    "MPL-2.0",
    "BSL-1.0",
]
confidence-threshold = 0.9
# The list is the policy, not an inventory of what is in use today.
unused-allowed-license = "allow"
# libFuzzer (LLVM) is NCSA, a permissive license; it is only linked into the
# fuzz targets in core/fuzz, which are not shipped.
exceptions = [{ allow = ["NCSA"], crate = "libfuzzer-sys" }]

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
