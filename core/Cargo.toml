[workspace]
resolver = "2"
members = ["edr-core", "edr-ffi", "edr-rulec"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.93"
publish = false

[workspace.dependencies]
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
postcard = { version = "1", default-features = false, features = ["alloc"] }
crc32fast = "1"
rand_core = { version = "0.6", features = ["getrandom"] }
hex = "0.4"
thiserror = "2"
yara-x = { version = "=1.21.0", default-features = false, features = ["constant-folding", "exact-atoms", "fast-regexp", "math-module", "string-module", "hash-module"] }

[profile.release]
panic = "unwind"
lto = "thin"

# Signature checks dominate test time in debug builds.
[profile.dev.package.curve25519-dalek]
opt-level = 3
[profile.dev.package.sha2]
opt-level = 3
