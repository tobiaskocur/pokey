[workspace]
resolver = "2"
members = ["pokey-core", "pokey-ffi", "pokey-rulec"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
publish = false
license = "Apache-2.0"
repository = "https://github.com/tobiaskocur/pokey"

[workspace.dependencies]
ed25519-dalek = "3.0"
sha2 = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
postcard = { version = "1", default-features = false, features = ["alloc"] }
crc32fast = "1"
getrandom = "0.4"
hex = "0.4"
thiserror = "2"
yara-x = { version = "=1.24.0", default-features = false, features = ["constant-folding", "exact-atoms", "fast-regexp", "math-module", "string-module", "hash-module"] }

[profile.release]
panic = "unwind"
lto = "thin"

# Signature checks dominate test time in debug builds.
[profile.dev.package.curve25519-dalek]
opt-level = 3
[profile.dev.package.sha2]
opt-level = 3
