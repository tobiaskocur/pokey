[package]
name = "edr-fuzz"
version = "0.0.0"
edition = "2021"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
edr-core = { path = "../edr-core" }
ed25519-dalek = "2.1"

# Not part of the core workspace: needs nightly and cargo-fuzz.
[workspace]

[[bin]]
name = "interp_ir"
path = "fuzz_targets/interp_ir.rs"
test = false
doc = false
bench = false

[[bin]]
name = "schema_shipped"
path = "fuzz_targets/schema_shipped.rs"
test = false
doc = false
bench = false

[[bin]]
name = "schema_compile"
path = "fuzz_targets/schema_compile.rs"
test = false
doc = false
bench = false

[[bin]]
name = "bundle_verify"
path = "fuzz_targets/bundle_verify.rs"
test = false
doc = false
bench = false
