version: 2
updates:
  - package-ecosystem: cargo
    directories: ["/core", "/core/fuzz"]
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: deps
    # One PR per crate covering both directories. core/fuzz uses pokey-core by
    # path, so a bump in only one directory leaves the other lockfile stale and
    # `cargo deny --locked` fails.
    groups:
      cargo:
        group-by: dependency-name
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]
