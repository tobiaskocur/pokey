name: Bug
description: Something does not work as documented.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected and what happened instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: Commands, a rule or a sample file (no malware attachments; describe or link it).
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: "`pokey-rulec --version`, the app version or the commit."
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform
      description: macOS or Linux version and CPU.
