name: core
on:
  push:
    branches: [main]
  pull_request:
    paths: ["core/**", "rules/**", ".github/workflows/core-ci.yml"]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.93.1
        with:
          components: clippy, rustfmt
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
  fuzz:
    runs-on: ubuntu-24.04
    needs: test
    defaults:
      run:
        working-directory: core/fuzz
    strategy:
      fail-fast: false
      matrix:
        target: [interp_ir, schema_compile, schema_shipped, bundle_verify]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - run: cargo install cargo-fuzz --locked
      - name: Fuzz ${{ matrix.target }} for 120 s
        run: cargo +nightly fuzz run ${{ matrix.target }} -- -max_total_time=120 -rss_limit_mb=2048
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-${{ matrix.target }}
          path: core/fuzz/artifacts
