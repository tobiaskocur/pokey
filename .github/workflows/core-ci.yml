name: core
on:
  push:
    branches: [main]
    paths: ["core/**", "rules/**", "macos/Config/Version.xcconfig", ".github/workflows/core-ci.yml"]
  pull_request:
    branches: [main]
    paths: ["core/**", "rules/**", "macos/Config/Version.xcconfig", ".github/workflows/core-ci.yml"]
permissions: {}
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: 1.95.0
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: core
      - name: App version matches the workspace version
        run: |
          cargo_v=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)
          app_v=$(sed -n 's/^MARKETING_VERSION = \([^ ]*\).*/\1/p' ../macos/Config/Version.xcconfig)
          echo "core/Cargo.toml $cargo_v, macos/Config/Version.xcconfig $app_v"
          [ -n "$cargo_v" ] && [ "$cargo_v" = "$app_v" ]
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
  deps:
    # Vulnerable or yanked crates, licenses incompatible with Apache-2.0,
    # unknown sources. Policy: core/deny.toml.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        manifest: [core/Cargo.toml, core/fuzz/Cargo.toml]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@17aeb3c839e42274e2b8adf721c8c65edfdc74dd # v2.1.3
        with:
          manifest-path: ${{ matrix.manifest }}
          arguments: --all-features --locked --config core/deny.toml
  fuzz:
    runs-on: ubuntu-24.04
    needs: test
    timeout-minutes: 20
    permissions:
      contents: read
    defaults:
      run:
        working-directory: core/fuzz
    strategy:
      fail-fast: false
      matrix:
        target: [interp_ir, schema_compile, schema_shipped, bundle_verify]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: nightly
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-fuzz
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: core/fuzz
      - name: Fuzz ${{ matrix.target }} for 60 s
        env:
          TARGET: ${{ matrix.target }}
        run: cargo +nightly fuzz run --target x86_64-unknown-linux-gnu "$TARGET" -- -max_total_time=60 -rss_limit_mb=2048
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-${{ matrix.target }}
          path: core/fuzz/artifacts
