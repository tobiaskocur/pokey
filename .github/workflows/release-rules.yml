# Two-stage rule release. `build` compiles and tests an unsigned bundle with no
# secrets. `sign` runs only in the `rules-release` environment, which must be
# configured with two required reviewers and holds the release-key signer
# (HSM/KMS) and the release certificate signed offline by k-of-n roots.
name: release-rules
on:
  workflow_dispatch:
    inputs:
      version:
        description: Monotonic bundle version (must exceed the deployed one)
        required: true
      channel:
        description: stable or canary
        required: true
        default: canary
      expires_days:
        description: Days until the bundle expires
        required: true
        default: "30"
permissions: {}
jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: 1.95.0
      - name: Validate inputs
        env:
          VERSION: ${{ inputs.version }}
          CHANNEL: ${{ inputs.channel }}
          DAYS: ${{ inputs.expires_days }}
        run: |
          case "$VERSION" in ''|*[!0-9]*) echo "version must be a number" >&2; exit 1;; esac
          case "$CHANNEL" in stable|canary) ;; *) echo "bad channel" >&2; exit 1;; esac
          case "$DAYS" in ''|*[!0-9]*) echo "expires_days must be a number" >&2; exit 1;; esac
      - name: Test and compile
        env:
          VERSION: ${{ inputs.version }}
          CHANNEL: ${{ inputs.channel }}
          DAYS: ${{ inputs.expires_days }}
        run: |
          cargo build --release --locked -p pokey-rulec --manifest-path core/Cargo.toml
          R=core/target/release/pokey-rulec
          $R lint --rules rules --deny-warnings
          $R test --rules rules --benign rules/benign --max-ms 50 --max-fuel-pct 50
          $R compile --rules rules --version "$VERSION" --channel "$CHANNEL" --expires-days "$DAYS" --out unsigned.bundle
          sha256sum unsigned.bundle | tee unsigned.sha256
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned-bundle
          path: |
            unsigned.bundle
            unsigned.sha256
          retention-days: 7
  sign:
    needs: build
    runs-on: ubuntu-24.04
    environment: rules-release
    permissions:
      contents: write
      id-token: write # OIDC to the KMS that holds the release key
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: 1.95.0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: unsigned-bundle
      - name: Require a configured signer
        env:
          SIGNER_CMD: ${{ vars.RULES_SIGNER_CMD }}
          RELEASE_CERT_B64: ${{ vars.RULES_RELEASE_CERT_B64 }}
        run: |
          if [ -z "$SIGNER_CMD" ] || [ -z "$RELEASE_CERT_B64" ]; then
            echo "::error::rules-release environment has no signer or release certificate configured"
            exit 1
          fi
      - name: Sign with the release key and verify against the pinned roots
        env:
          # Command that reads the message on stdin and prints the Ed25519
          # signature, e.g. a Cloud KMS EC_SIGN_ED25519 wrapper (see docs/deploying.md).
          SIGNER_CMD: ${{ vars.RULES_SIGNER_CMD }}
          RELEASE_CERT_B64: ${{ vars.RULES_RELEASE_CERT_B64 }}
          ROOT_THRESHOLD: ${{ vars.RULES_ROOT_THRESHOLD }}
          VERSION: ${{ inputs.version }}
          CHANNEL: ${{ inputs.channel }}
        run: |
          sha256sum -c unsigned.sha256
          cargo build --release --locked -p pokey-rulec --manifest-path core/Cargo.toml
          R=core/target/release/pokey-rulec
          echo "$RELEASE_CERT_B64" | base64 -d > release.cert
          $R cert-show --cert release.cert
          $R sign --in unsigned.bundle --cert release.cert --signer-cmd "$SIGNER_CMD" --out "rules-$VERSION.bundle"
          $R verify --bundle "rules-$VERSION.bundle" --roots macos/Config/trust-roots.txt \
            --threshold "$ROOT_THRESHOLD" --self-test
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          CHANNEL: ${{ inputs.channel }}
        run: |
          flag=""
          [ "$CHANNEL" = canary ] && flag="--prerelease"
          gh release create "rules-$VERSION" "rules-$VERSION.bundle" $flag \
            --title "Rules $VERSION ($CHANNEL)" --notes "Signed rule bundle $VERSION for the $CHANNEL channel."
