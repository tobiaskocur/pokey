# macOS runners cost 10x Linux minutes: run only for main and PRs into main,
# one job, host architecture only, cancel superseded runs.
name: macos
on:
  push:
    branches: [main]
    paths: ["macos/**", "core/**", "rules/**", ".github/workflows/macos-ci.yml"]
  pull_request:
    branches: [main]
    paths: ["macos/**", "core/**", "rules/**", ".github/workflows/macos-ci.yml"]
permissions: {}
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    permissions:
      contents: read
    defaults:
      run:
        working-directory: macos
    env:
      CORE_TARGETS: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: 1.95.0
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: core
      - run: swift --version && xcodebuild -version
      - name: Swift tests (PokeyCore, PokeyRules)
        run: make test
      - name: SwiftPM build of all macOS targets
        run: make build
      - name: Unsigned Xcode build of the app bundle
        run: |
          brew install xcodegen
          make xcode XCODEBUILD_FLAGS="CODE_SIGNING_ALLOWED=NO ARCHS=arm64 ONLY_ACTIVE_ARCH=YES"
