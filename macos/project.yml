# XcodeGen spec: `make xcode` (needs xcodegen, Xcode 16+, and the Rust static
# library from `make core`). Identity comes from Config/Identity.xcconfig.
#
# Pokey.app (host, /Applications)
#   Contents/MacOS/Pokey             host UI: installs the pieces below
#   Contents/MacOS/pokey-netd             LaunchDaemon as _pokeynet (reads host Info.plist)
#   Contents/Helpers/Pokey Alerts.app     per-user LaunchAgent (notifications)
#   Contents/Library/LaunchDaemons/netd.plist, LaunchAgents/ui.plist (rendered)
#   Contents/Library/SystemExtensions/<prefix>.sensor.systemextension
#     Contents/MacOS/pokey-sensor, Contents/MacOS/pokey-inspector, Resources/trust-roots.txt
name: Pokey
options:
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true
configFiles:
  Debug: Config/Identity.xcconfig
  Release: Config/Identity.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ARCHS: "arm64 x86_64"
    ONLY_ACTIVE_ARCH: NO
    ENABLE_HARDENED_RUNTIME: YES
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "Developer ID Application"
    DEVELOPMENT_TEAM: $(POKEY_TEAM_ID)
    OTHER_CODE_SIGN_FLAGS: "--timestamp"
    CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
    SWIFT_INCLUDE_PATHS: $(SRCROOT)/Sources/CPokeyCore
    LIBRARY_SEARCH_PATHS: $(SRCROOT)/../core/target/swift
    DEAD_CODE_STRIPPING: YES
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES

targetTemplates:
  Tool:
    type: tool
    platform: macOS
    settings:
      SKIP_INSTALL: YES
      CODE_SIGN_ENTITLEMENTS: Config/None.entitlements
      # Tools have no Info.plist: sign with the identifier the peers pin.
      OTHER_CODE_SIGN_FLAGS: "--timestamp -i $(PRODUCT_BUNDLE_IDENTIFIER)"

targets:
  PokeyCore:
    type: library.static
    platform: macOS
    sources: [Sources/PokeyCore]

  PokeyRules:
    type: library.static
    platform: macOS
    sources: [Sources/PokeyRules]
    dependencies:
      - target: PokeyCore

  PokeyPlatform:
    type: library.static
    platform: macOS
    sources: [Sources/PokeyPlatform]
    dependencies:
      - target: PokeyCore

  pokey-inspector:
    templates: [Tool]
    sources: [Sources/pokey-inspector]
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: $(POKEY_BUNDLE_PREFIX).inspector
      OTHER_LDFLAGS: -lpokey_ffi
    dependencies:
      - target: PokeyCore
      - target: PokeyRules
      - target: PokeyPlatform

  pokey-netd:
    templates: [Tool]
    sources: [Sources/pokey-netd]
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: $(POKEY_BUNDLE_PREFIX).netd
    dependencies:
      - target: PokeyCore
      - target: PokeyPlatform

  pokey-sensor:
    type: system-extension
    platform: macOS
    sources:
      - Sources/pokey-sensor
      - path: Config/trust-roots.txt
        buildPhase: resources
    settings:
      PRODUCT_NAME: $(POKEY_BUNDLE_PREFIX).sensor
      PRODUCT_BUNDLE_IDENTIFIER: $(POKEY_BUNDLE_PREFIX).sensor
      EXECUTABLE_NAME: pokey-sensor
      INFOPLIST_FILE: Config/Sensor-Info.plist
      CODE_SIGN_ENTITLEMENTS: Config/Sensor.entitlements
      PROVISIONING_PROFILE_SPECIFIER: $(POKEY_SENSOR_PROFILE)
      SKIP_INSTALL: YES
      OTHER_LDFLAGS: -lpokey_ffi
    dependencies:
      - target: PokeyCore
      - target: PokeyRules
      - target: PokeyPlatform
      - sdk: libEndpointSecurity.tbd
      - sdk: libbsm.tbd
      - sdk: libsqlite3.tbd
      - target: pokey-inspector
        copy:
          destination: executables

  PokeyAlerts:
    type: application
    platform: macOS
    sources: [Sources/pokey-ui]
    settings:
      PRODUCT_NAME: Pokey Alerts
      PRODUCT_BUNDLE_IDENTIFIER: $(POKEY_BUNDLE_PREFIX).ui
      INFOPLIST_FILE: Config/UI-Info.plist
      CODE_SIGN_ENTITLEMENTS: Config/None.entitlements
      SKIP_INSTALL: YES
    dependencies:
      - target: PokeyCore
      - target: PokeyPlatform

  PokeyHost:
    type: application
    platform: macOS
    sources: [Sources/PokeyHost]
    settings:
      PRODUCT_NAME: Pokey
      PRODUCT_BUNDLE_IDENTIFIER: $(POKEY_BUNDLE_PREFIX).host
      INFOPLIST_FILE: Config/Host-Info.plist
      CODE_SIGN_ENTITLEMENTS: Config/Host.entitlements
      PROVISIONING_PROFILE_SPECIFIER: $(POKEY_HOST_PROFILE)
    dependencies:
      - target: PokeyPlatform
      - target: PokeyCore
      - target: pokey-sensor
      - target: pokey-netd
        copy:
          destination: executables
      - target: PokeyAlerts
        copy:
          destination: wrapper
          subpath: Contents/Helpers
    postBuildScripts:
      - name: Render launchd plists
        script: '"$SRCROOT/scripts/render-launchd.sh"'
        inputFiles:
          - $(SRCROOT)/Config/launchd/netd.plist.in
          - $(SRCROOT)/Config/launchd/ui.plist.in
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(CONTENTS_FOLDER_PATH)/Library/LaunchDaemons/netd.plist
          - $(TARGET_BUILD_DIR)/$(CONTENTS_FOLDER_PATH)/Library/LaunchAgents/ui.plist

schemes:
  PokeyHost:
    build:
      targets:
        PokeyHost: all
